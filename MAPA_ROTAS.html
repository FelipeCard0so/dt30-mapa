<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fora de Operação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .message {
            font-size: clamp(1.5rem, 4vw, 3.5rem);
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            padding: 0 20px;
            animation: colorChange 6s infinite alternate;
        }

        /* Estilo opcional para o h4 acompanhar a centralização e harmonia */
        .message h4 {
            font-size: clamp(1rem, 2vw, 1.8rem);
            margin-top: 15px;
            font-weight: 600;
        }

        @keyframes colorChange {
            0% { color: #ff3b30; }
            25% { color: #ff9500; }
            50% { color: #34c759; }
            75% { color: #007aff; }
            100% { color: #af52de; }
        }
    </style>
</head>
<body>

    <div class="message">
        - FORA DE OPERAÇÃO ATÉ O MEU RETORNO - <br>
        <h4>Felipe Cardoso</h4>
    </div>

</body>
</html>
